<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Thank you page confirming successful product review submission.">
  <meta name="author" content="Takudzwa P. Matimura">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You</title>
  <link rel="stylesheet" href="styles/form.css">
</head>

<body>

<main>
  <section class="card">
    <h1>Thank You!</h1>
    <p id="count"></p>
    <a href="form.html"><button>Submit Another Review</button></a>
  </section>
</main>

<script>
  let count = Number(localStorage.getItem("reviews")) || 0;
  localStorage.setItem("reviews", ++count);

  document.getElementById("count").textContent =
    `You have submitted ${count} review${count !== 1 ? "s" : ""}.`;

document.querySelector(".site-footer")
  .addEventListener("click", e => {
    if (e.shiftKey) {
      localStorage.removeItem("reviews");
      localStorage.removeItem("lastReview");
      alert("Dev reset complete 🚀");
    }
  });


</script>

</body>
</html>
