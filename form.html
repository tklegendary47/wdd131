<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="A professional and accessible product review form built for WDD 131, featuring JavaScript-driven product selection and localStorage tracking.">
  <meta name="author" content="Takudzwa P. Matimura">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Review | WDD 131</title>

  <link rel="stylesheet" href="styles/form.css">
  <script defer src="scripts/form.js"></script>
</head>

<body>

<header>
  <nav>
    <span>WDD 131</span>
    <a href="#form">Review</a>
  </nav>
</header>

<main>
  <section class="card" id="card">

    <form id="form" method="get" action="review.html">

      <h1>Product Review</h1>

      <label for="name">Full Name <span class="required">*</span></label>
      <input id="name" type="text" name="name" required>

      <label for="email">Email Address <span class="required">*</span></label>
      <input id="email" type="email" name="email" required>

      <label for="product">Product Name <span class="required">*</span></label>
      <select id="product" name="product" required>
        <option value="" disabled selected hidden>Select a product</option>
      </select>

      <fieldset>
        <legend>Overall Rating <span class="required">*</span></legend>
        <div class="stars">
          <input id="r5" type="radio" name="rating" value="5" required><label for="r5">★</label>
          <input id="r4" type="radio" name="rating" value="4" required><label for="r4">★</label>
          <input id="r3" type="radio" name="rating" value="3" required><label for="r3">★</label>
          <input id="r2" type="radio" name="rating" value="2" required><label for="r2">★</label>
          <input id="r1" type="radio" name="rating" value="1" required><label for="r1">★</label>
        </div>
      </fieldset>

      <label for="date">Date Installed <span class="required">*</span></label>
      <input id="date" type="date" name="date" required>

<fieldset class="features">
  <legend>Features Used</legend>

  <div class="feature-item">
    <label for="feature-durability">Durability</label>
    <input
      type="checkbox"
      id="feature-durability"
      name="features"
      value="durability"
    >
  </div>

  <div class="feature-item">
    <label for="feature-design">Design</label>
    <input
      type="checkbox"
      id="feature-design"
      name="features"
      value="design"
    >
  </div>

  <div class="feature-item">
    <label for="feature-performance">Performance</label>
    <input
      type="checkbox"
      id="feature-performance"
      name="features"
      value="performance"
    >
  </div>

  <div class="feature-item">
    <label for="feature-ease">Ease of Use</label>
    <input
      type="checkbox"
      id="feature-ease"
      name="features"
      value="ease"
    >
  </div>
</fieldset>



      <label for="review">Written Review</label>
      <textarea id="review" name="review" rows="4"></textarea>

      <button type="submit">Submit Review</button>

    </form>

  </section>
</main>

<footer class="site-footer">
  <p>© <span id="year"></span> Takudzwa P. Matimura</p>
  <p>WDD 131 – Dynamic Web Fundamentals | BYU-Idaho</p>
  <p>Last Modified: <span id="modified"></span></p>
</footer>

</body>
</html>
