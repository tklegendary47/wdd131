<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="description" content="WDD 131 Product Review Form">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Review | WDD 131</title>

<link rel="stylesheet" href="project-styles/form.css">
<script defer src="project-scripts/form.js"></script>
</head>

<body>
<div class="parallax"></div>

<nav>
  <span>WDD 131</span>
  <a href="#form">Review</a>
</nav>

<main>
<section class="card" id="card">

<form id="form" method="get" action="review.html">

<h1>Product Review</h1>

<label>Full Name <span class="required">*</span></label>
<input type="text" name="name" required>

<label>Email Address <span class="required">*</span></label>
<input type="email" name="email" required>

<label>Product <span class="required">*</span></label>
<select id="product" name="product" required>
  <option value="" disabled selected hidden>Select a product</option>
</select>

<label>Overall Rating <span class="required">*</span></label>
<div class="stars">
  <input id="r5" type="radio" name="rating" value="5" required><label for="r5">★</label>
  <input id="r4" type="radio" name="rating" value="4"><label for="r4">★</label>
  <input id="r3" type="radio" name="rating" value="3"><label for="r3">★</label>
  <input id="r2" type="radio" name="rating" value="2"><label for="r2">★</label>
  <input id="r1" type="radio" name="rating" value="1"><label for="r1">★</label>
</div>

<label>Date Installed <span class="required">*</span></label>
<input type="date" name="date" required>

<label>Written Review</label>
<textarea name="review" rows="4"></textarea>

<button type="submit">Submit Review</button>

</form>

</section>
</main>

<footer>
<p>© <span id="year"></span> Takudzwa P. Matimura</p>
<p>WDD 131 – Dynamic Web Fundamentals | BYU-Idaho</p>
<p>Last Modified: <span id="modified"></span></p>
</footer>

</body>
</html>
